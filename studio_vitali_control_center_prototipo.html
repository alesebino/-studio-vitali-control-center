<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Vitali | Control Center</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#203047;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#174c76;color:white}button.secondary{background:#eaf0f6;color:#24425d}button.ghost{background:transparent;color:#24425d}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #76b3e3}aside{width:238px;position:fixed;inset:0 auto 0 0;background:#102c46;color:white;padding:22px 14px}aside h2{font-size:17px;margin:8px 10px 2px}aside small{display:block;color:#b3c5d7;margin:0 10px 30px}nav button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;color:#c8d7e5;margin:5px 0}nav button.active,nav button:hover{background:#285474;color:white}main{margin-left:238px;padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:26px}.muted{color:#718095;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #e0e7ef;border-radius:15px;padding:18px;box-shadow:0 3px 15px #193b5510}.metric strong{font-size:30px;display:block}.metric span{font-size:13px;color:#6c7d8e}.section{margin-top:24px}.section h3{margin:0 0 12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{background:white;border:1px solid #d6e0e8;border-radius:9px;padding:10px;width:100%;color:#23364a}textarea{min-height:105px;resize:vertical}label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}.field{margin-bottom:13px}.split{display:grid;grid-template-columns:1.5fr 1fr;gap:15px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e8edf2;padding:13px 0}.item:last-child{border:0}.item strong{display:block;margin-bottom:4px}.pill{display:inline-block;font-size:12px;border-radius:30px;padding:5px 9px;background:#eaf0f6;color:#37536b}.pill.urgent{background:#fde6e5;color:#ad3434}.pill.wait{background:#fff1d8;color:#946012}.pill.done{background:#e0f4e7;color:#22734c}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.overlay{position:fixed;inset:0;background:#0b1e3099;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.overlay.show{display:flex}.dialog{width:min(660px,100%);max-height:92vh;overflow:auto;background:white;border-radius:16px;padding:22px}.dialog h2{margin-top:0}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.timeline{border-left:2px solid #c6d9e8;padding-left:16px}.event{margin:14px 0;position:relative}.event:before{content:'';position:absolute;left:-22px;top:5px;width:10px;height:10px;background:#3c7ba9;border-radius:50%}.empty{padding:24px;color:#718095;text-align:center}.voice{background:#edf6fc;border:1px solid #b7d6ea;padding:14px;border-radius:12px}.voice button{margin:8px 0}.mobiletop{display:none}@media(max-width:900px){aside{width:68px;padding:12px 5px}aside h2,aside small,nav .navlabel{display:none}nav button{justify-content:center;font-size:20px}main{margin-left:68px;padding:15px}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:550px){.grid,.two{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:22px}.card{padding:13px}.metric strong{font-size:24px}}
</style></head><body><aside><h2>STUDIO VITALI</h2><small>CONTROL CENTER · DEMO</small><nav id="nav"></nav></aside><main><header class="top"><div><h1 id="heading">Dashboard</h1><div class="muted">Ambiente dimostrativo · dati salvati solo in questo browser</div></div><button onclick="openVoice()">🎙 Racconta</button></header><div id="app"></div></main><div id="overlay" class="overlay"><div class="dialog"><div class="actions"><button class="ghost" onclick="closeModal()">✕ Chiudi</button></div><div id="modal"></div></div></div><script>
const initial=[{id:'TEC-2026-001',cond:'Le Dimore',title:'Infiltrazione autorimessa',cat:'Infiltrazioni',priority:'Urgente',status:'In corso',owner:'Condivisa',next:'Verificare preventivo impresa',date:'2026-10-15',events:[{date:'2026-10-12',by:'Studio',text:'Segnalazione ricevuta telefonicamente.'},{date:'2026-10-13',by:'Tecnico',text:'Sopralluogo: tracce di percolamento rilevate.'}]},{id:'TEC-2026-002',cond:'Centro',title:'Guasto cancello carraio',cat:'Impianti',priority:'Normale',status:'In attesa',owner:'Condivisa',next:'Sollecitare manutentore',date:'2026-10-16',events:[{date:'2026-10-11',by:'Studio',text:'Richiesta intervento inviata.'}]},{id:'TEC-2026-003',cond:'Lago',title:'Verifica copertura',cat:'Coperture',priority:'Alta',status:'Da verificare',owner:'Condivisa',next:'Organizzare sopralluogo',date:'2026-10-19',events:[{date:'2026-10-13',by:'Studio',text:'Nuova segnalazione.'}]}];
let cases;try{cases=JSON.parse(localStorage.getItem('svcc_cases'))||initial}catch{cases=initial}let view='Dashboard',current=null;const conds=['Le Dimore','Centro','Lago','Altri condomini (demo)'];const navs=[['Dashboard','▦'],['Pratiche','▤'],['Condomini','▥'],['Sopralluoghi','▣'],['Agenda','▦']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('svcc_cases',JSON.stringify(cases))}function badge(s){return '<span class="pill '+(s==='Urgente'?'urgent':s==='In attesa'?'wait':s==='Chiusa'?'done':'')+'">'+esc(s)+'</span>'}function go(v){view=v;current=null;render()}function render(){document.getElementById('heading').textContent=current?current.id:view;document.getElementById('nav').innerHTML=navs.map(([n,i])=>'<button class="'+(view===n?'active':'')+'" onclick="go(\''+n+'\')"><span>'+i+'</span><span class="navlabel">'+n+'</span></button>').join('');let a=document.getElementById('app');if(current){detail(current);return}if(view==='Dashboard'){let open=cases.filter(x=>x.status!=='Chiusa');a.innerHTML='<div class="grid">'+[['Condomini',50],['Pratiche aperte',open.length],['Urgenti',open.filter(x=>x.priority==='Urgente').length],['In attesa',open.filter(x=>x.status==='In attesa').length]].map(([k,v])=>'<div class="card metric"><strong>'+v+'</strong><span>'+k+'</span></div>').join('')+'</div><div class="split section"><div class="card"><h3>Pratiche che richiedono attenzione</h3>'+rows(open)+'</div><div class="card"><h3>Azioni rapide</h3><div class="toolbar"><button onclick="newCase()">+ Nuova segnalazione</button><button class="secondary" onclick="newVisit()">+ Sopralluogo</button><button class="secondary" onclick="openVoice()">🎙 Racconta</button></div><h3>Metodo condiviso</h3><p class="muted">Tutti e cinque gli operatori possono consultare e aggiornare le pratiche. Ogni modifica aggiunge un evento allo storico.</p></div></div>'}else if(view==='Pratiche'){a.innerHTML='<div class="toolbar"><input id="filter" placeholder="Cerca per condominio, oggetto o codice" oninput="filterRows()" style="max-width:400px"><button onclick="newCase()">+ Nuova segnalazione</button></div><div class="card" id="caseRows">'+rows(cases)+'</div>'}else if(view==='Condomini'){a.innerHTML='<div class="grid">'+conds.map(c=>'<div class="card"><h3>'+esc(c)+'</h3><p class="muted">'+cases.filter(x=>x.cond===c).length+' pratiche demo</p><button class="secondary" onclick="goCondo(\''+c.replace(/'/g,'')+'\')">Apri fascicolo</button></div>').join('')+'</div>'}else if(view==='Sopralluoghi'){a.innerHTML='<div class="card"><h3>Rapportini di sopralluogo</h3><p class="muted">Compila il rapporto, registra osservazioni e genera una stampa PDF dal browser.</p><button onclick="newVisit()">+ Nuovo sopralluogo</button></div>'}else if(view==='Agenda'){a.innerHTML='<div class="card"><h3>Prossime attività</h3>'+cases.filter(x=>x.status!=='Chiusa').sort((a,b)=>a.date.localeCompare(b.date)).map(x=>'<div class="item"><div><strong>'+esc(x.next||'Nessuna attività')+'</strong><span class="muted">'+esc(x.cond)+' · '+esc(x.date||'Senza data')+'</span></div><button class="secondary" onclick="showCase(\''+x.id+'\')">Apri</button></div>').join('')+'</div>'}}function rows(arr){return arr.length?arr.map(x=>'<div class="item"><div><span class="muted">'+esc(x.id)+' · '+esc(x.cond)+'</span><strong>'+esc(x.title)+'</strong><span class="muted">'+esc(x.next||'Nessuna prossima azione')+'</span></div><div style="text-align:right">'+badge(x.priority)+'<div style="margin-top:7px"><button class="secondary" onclick="showCase(\''+x.id+'\')">Apri</button></div></div></div>').join(''):'<div class="empty">Nessuna pratica</div>'}function filterRows(){let s=document.getElementById('filter').value.toLowerCase();document.getElementById('caseRows').innerHTML=rows(cases.filter(x=>(x.id+x.cond+x.title).toLowerCase().includes(s)))}function goCondo(c){go('Pratiche');document.getElementById('filter').value=c;filterRows()}function showCase(id){current=cases.find(x=>x.id===id);render()}function detail(x){document.getElementById('app').innerHTML='<div class="toolbar"><button class="secondary" onclick="go(\'Pratiche\')">← Registro pratiche</button><button onclick="addEvent()">+ Aggiorna pratica</button><button class="secondary" onclick="openVoice(\''+x.id+'\')">🎙 Racconta aggiornamento</button><button class="secondary" onclick="newVisit(\''+x.id+'\')">+ Sopralluogo</button></div><div class="split"><div class="card"><span class="muted">'+esc(x.cond)+' · '+esc(x.id)+'</span><h2>'+esc(x.title)+'</h2><p>'+badge(x.priority)+' '+badge(x.status)+'</p><div class="two"><div><label>Stato</label><select id="status">'+['Da verificare','In corso','In attesa','Chiusa'].map(v=>'<option '+(x.status===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div><label>Referente operativo</label><input id="owner" value="'+esc(x.owner)+'"></div></div><div class="field"><label>Prossima azione</label><input id="next" value="'+esc(x.next)+'"></div><div class="field"><label>Data verifica</label><input type="date" id="date" value="'+esc(x.date)+'"></div><button onclick="updateCase()">Salva aggiornamento</button></div><div class="card"><h3>Cronologia</h3><div class="timeline">'+x.events.map(e=>'<div class="event"><strong>'+esc(e.date)+' · '+esc(e.by)+'</strong><p>'+esc(e.text)+'</p></div>').join('')+'</div></div></div>'}function updateCase(){let x=current;x.status=document.getElementById('status').value;x.owner=document.getElementById('owner').value;x.next=document.getElementById('next').value;x.date=document.getElementById('date').value;x.events.push({date:today(),by:'Operatore demo',text:'Aggiornati stato, referente o prossima azione.'});save();render()}function today(){return new Date().toISOString().slice(0,10)}function openModal(h){document.getElementById('modal').innerHTML=h;document.getElementById('overlay').classList.add('show')}function closeModal(){document.getElementById('overlay').classList.remove('show')}function newCase(prefill=''){openModal('<h2>Nuova segnalazione</h2><form onsubmit="createCase(event)"><div class="field"><label>Condominio</label><select id="nc">'+conds.map(c=>'<option>'+esc(c)+'</option>').join('')+'</select></div><div class="field"><label>Oggetto</label><input id="nt" required placeholder="Descrizione sintetica"></div><div class="field"><label>Racconto / note</label><textarea id="nn" placeholder="Descrivi la segnalazione">'+esc(prefill)+'</textarea></div><div class="two"><div class="field"><label>Priorità</label><select id="np"><option>Normale</option><option>Alta</option><option>Urgente</option><option>Bassa</option></select></div><div class="field"><label>Prossima verifica</label><input type="date" id="nd" value="'+today()+'"></div></div><div class="field"><label>Prossima azione</label><input id="na" placeholder="Es. contattare manutentore"></div><div class="actions"><button type="submit">Registra segnalazione</button></div></form>')}function createCase(e){e.preventDefault();let id='TEC-'+new Date().getFullYear()+'-'+String(cases.length+1).padStart(3,'0');cases.unshift({id,cond:document.getElementById('nc').value,title:document.getElementById('nt').value,cat:'Da classificare',priority:document.getElementById('np').value,status:'Da verificare',owner:'Condivisa',next:document.getElementById('na').value,date:document.getElementById('nd').value,events:[{date:today(),by:'Operatore demo',text:document.getElementById('nn').value||'Segnalazione aperta.'}]});save();closeModal();showCase(id)}function addEvent(prefill=''){openModal('<h2>Nuovo evento · '+esc(current.id)+'</h2><form onsubmit="saveEvent(event)"><div class="field"><label>Tipo</label><select id="et"><option>Telefonata</option><option>Email</option><option>Nota tecnica</option><option>Intervento fornitore</option><option>Altro</option></select></div><div class="field"><label>Descrizione</label><textarea id="ev" required>'+esc(prefill)+'</textarea></div><button type="submit">Aggiungi allo storico</button></form>')}function saveEvent(e){e.preventDefault();current.events.push({date:today(),by:'Operatore demo · '+document.getElementById('et').value,text:document.getElementById('ev').value});save();closeModal();render()}function newVisit(id=''){openModal('<h2>Rapportino di sopralluogo</h2><form onsubmit="printVisit(event)"><div class="field"><label>Pratica collegata</label><select id="vc"><option value="">Non collegata</option>'+cases.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===id?'selected':'')+'>'+esc(x.id+' · '+x.title)+'</option>').join('')+'</select></div><div class="field"><label>Condominio</label><select id="vcond">'+conds.map(c=>'<option>'+esc(c)+'</option>').join('')+'</select></div><div class="field"><label>Oggetto</label><input id="vtitle" required></div><div class="field"><label>Osservazioni (anche dettate)</label><textarea id="vnotes" required></textarea></div><div class="field"><label>Valutazioni e interventi consigliati</label><textarea id="vaction"></textarea></div><div class="actions"><button type="button" class="secondary" onclick="startDictation(\'vnotes\')">🎙 Detta osservazioni</button><button type="submit">Salva e stampa PDF</button></div></form>')}function printVisit(e){e.preventDefault();let id=document.getElementById('vc').value,cond=document.getElementById('vcond').value,title=document.getElementById('vtitle').value,notes=document.getElementById('vnotes').value,act=document.getElementById('vaction').value;if(id){let x=cases.find(z=>z.id===id);x.events.push({date:today(),by:'Operatore demo · Sopralluogo',text:title+' — '+notes+' — '+act});save()}let w=window.open('','_blank');if(!w){alert('Abilita i popup per stampare il rapportino.');return}w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Rapportino</title><style>body{font:15px Arial;margin:45px;line-height:1.6}h1{color:#174c76}h2{margin-top:35px}footer{margin-top:70px;border-top:1px solid #aaa;padding-top:10px}</style></head><body><h1>STUDIO VITALI · Rapportino di sopralluogo</h1><p>Data: '+today()+'<br>Condominio: '+esc(cond)+'<br>Pratica: '+esc(id||'Non collegata')+'</p><h2>'+esc(title)+'</h2><h3>Osservazioni</h3><p>'+esc(notes).replace(/\n/g,'<br>')+'</p><h3>Valutazioni e azioni consigliate</h3><p>'+esc(act).replace(/\n/g,'<br>')+'</p><footer>Bozza da verificare e firmare dal tecnico incaricato.</footer><script>window.onload=()=>window.print()<\/script></body></html>');w.document.close();closeModal();render()}let recognition;function startDictation(target){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('La dettatura non è disponibile in questo browser. Puoi digitare il racconto oppure usare la dettatura della tastiera del dispositivo.');return}recognition=new SR();recognition.lang='it-IT';recognition.continuous=true;recognition.interimResults=false;recognition.onresult=e=>{let t=document.getElementById(target);if(t)for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t.value+=(t.value?' ':'')+e.results[i][0].transcript};recognition.onerror=e=>alert('Dittatura non disponibile: '+e.error);recognition.start();let b=document.getElementById('recordBtn');if(b)b.textContent='🔴 Registrazione attiva · ferma';}function stopDictation(){if(recognition)recognition.stop();let b=document.getElementById('recordBtn');if(b)b.textContent='🎙 Avvia dettatura'}function openVoice(id=''){openModal('<h2>🎙 Racconta</h2><p class="muted">Racconta liberamente una telefonata, una segnalazione o un aggiornamento. La demo offre dettatura compatibile con alcuni browser; non interpreta automaticamente il contenuto con IA.</p><div class="voice"><textarea id="speech" placeholder="Es. Ha telefonato il signor Rossi del condominio Le Dimore..." style="min-height:145px"></textarea><div class="toolbar"><button id="recordBtn" onclick="startDictation(\'speech\')">🎙 Avvia dettatura</button><button class="secondary" onclick="stopDictation()">Ferma</button></div></div><div class="actions"><button class="secondary" onclick="voiceToCase()">Crea segnalazione</button><button onclick="voiceToEvent(\''+esc(id)+'\')">Aggiorna pratica</button></div>')}function voiceToCase(){let s=document.getElementById('speech').value;newCase(s)}function voiceToEvent(id){let s=document.getElementById('speech').value;if(!id){openModal('<h2>Seleziona la pratica</h2><div class="field"><select id="pick">'+cases.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.id+' · '+x.title)+'</option>').join('')+'</select></div><button onclick="voiceToEvent(document.getElementById(\'pick\').value)">Continua</button><p class="muted">Per aggiornare una pratica, è più rapido usare il pulsante Racconta dalla sua scheda.</p>');return}current=cases.find(x=>x.id===id);addEvent(s)}render();
</script></body></html>
